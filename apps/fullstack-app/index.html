<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Meta XR</title>
    <style>
      :root {
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        align-content: center;
        background: radial-gradient(circle at top, #312e81, #0f172a 60%);
        box-sizing: border-box;
        display: grid;
        inset: 0;
        justify-items: center;
        padding: 1.5rem;
        position: fixed;
        text-align: center;
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        letter-spacing: -0.05em;
        margin: 0;
        max-width: 42rem;
      }

      p {
        color: #cbd5e1;
        font-size: 1.125rem;
        line-height: 1.6;
        margin: 1.25rem 0 2rem;
        max-width: 42rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }

      a {
        border: 1px solid #a78bfa;
        border-radius: 0.625rem;
        color: inherit;
        font-weight: 700;
        padding: 0.75rem 1.25rem;
        text-decoration: none;
      }

      a:first-child {
        background: #8b5cf6;
        border-color: #8b5cf6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Meta XR</h1>
      <p>Explore an interactive world built for the web and virtual reality.</p>
      <div class="actions">
        <a href="/sign-in">Sign in to play</a>
        <a href="/sign-up">Create an account</a>
      </div>
    </main>
  </body>
</html>
